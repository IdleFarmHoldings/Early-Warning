name: Collector

# GitHub's free scheduler often runs only about once an hour, so each run keeps working for ~50 minutes:
# a full check every 15 minutes, and a check of alerts/outbox every minute in between.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "alerts/outbox/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      NTFY_PROACTIVE: ${{ secrets.NTFY_PROACTIVE }}
      NTFY_REACTIVE: ${{ secrets.NTFY_REACTIVE }}
      AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      PASSES: "4"
      PASS_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websocket client
        run: pip install -q websockets==13.1

      - name: Collect, alert and save (repeats through the hour)
        run: |
          git config user.name "early-warning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add data state alerts
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "$1: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && return 0
              sleep 5
            done
            echo "push failed"; return 1
          }
          start=$(date +%s)
          for n in $(seq 1 "$PASSES"); do
            python collector/run.py || echo "collector pass $n failed"
            save collector || true
            # optional outside watchdog (healthchecks.io): it alerts if these pings stop arriving
            if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 --retry 2 "$HEALTHCHECK_URL" >/dev/null || true; fi
            [ "$n" -ge "$PASSES" ] && break
            next=$((start + n * PASS_SECONDS))
            while [ "$(date +%s)" -lt "$next" ]; do
              sleep 60
              git pull -q --rebase -X theirs || true
              if ls alerts/outbox/*.json >/dev/null 2>&1; then
                python collector/run.py --relay-only || true
                save "collector relay" || true
              fi
            done
          done

      - name: Start the next run (keeps checks going even when GitHub's timer is late)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collector.yml --ref main || echo "could not queue the next run; the timer and watchdog will"
