name: Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "alerts/outbox/**"

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websocket client
        run: pip install -q websockets==13.1

      - name: Run collector
        env:
          NTFY_PROACTIVE: ${{ secrets.NTFY_PROACTIVE }}
          NTFY_REACTIVE: ${{ secrets.NTFY_REACTIVE }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: python collector/run.py

      - name: Save data
        run: |
          git config user.name "early-warning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state alerts
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "collector: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep 5
          done
          exit 1
